name: Project checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run matchmaking tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check matchmaker/queue.js
          node --check matchmaker/queue.test.js
          node --check routes/launcher-matchmaking.js
          node --check launcher/main.js
          node --check launcher/preload.js
          node --check launcher/renderer/app.js
