name: Project checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm ci
      - name: Run project regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check matchmaker/queue.js
          node --check matchmaker/queue.test.js
          node --check utils/networkAddress.js
          node --check test/publicGameAddress.test.js
          node --check structs/shopManager.js
          node --check structs/itemShop.js
          node --check test/itemShopCustomStorefronts.test.js
          node --check test/panelRouteSecurity.test.js
          node --check structs/shopStaff.js
          node --check structs/gameRewards.js
          node --check structs/arenaModes.js
          node --check structs/gameserver.js
          node --check test/backendRebootEngine.test.js
          node --check test/shopManager.test.js
          node --check test/gameRewards.test.js
          node --check test/startingVbucks.test.js
          node --check routes/ogil-arena.js
          node --check routes/matchmaking.js
          node --check test/ogilArenaMatchmaking.test.js
          node --check routes/panel-api.js
          node --check panel/app.js
          node --check routes/launcher-matchmaking.js
          node --check utils/config.js
          node --check utils/cloudstoragePaths.js
          node --check launcher/main.js
          node --check launcher/persistent-backend-config.js
          node --check test/persistentBackendConfig.test.js
          node --check test/persistentShopCatalog.test.js
          node --check test/ownerPanelBootstrap.test.js
          node --check test/persistentUserData.test.js
          node --check test/persistentCloudStorage.test.js
          node --check launcher/gameserver-host.js
          node --check test/rebootEngineDiscovery.test.js
          node --check launcher/preload.js
          node --check launcher/renderer/app.js
